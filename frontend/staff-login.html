<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e9eee7"><title>เข้าสู่ระบบพนักงาน | Boardgame &amp; Brew Café</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/polish.css"><link rel="stylesheet" href="/zones.css"><link rel="stylesheet" href="/auth.css"></head>
<body><header class="hero staff-hero"><nav><a class="brand" href="/">Boardgame &amp; Brew Café</a><a class="api-link" href="/">กลับหน้าลูกค้า</a></nav><div class="hero-copy"><p class="eyebrow">TEAM WORKSPACE</p><h1>พื้นที่<br><span>สำหรับพนักงาน</span></h1><p>เข้าสู่ระบบเพื่อจัดการรายการจองและแคตตาล็อก</p></div></header>
<main class="auth-main"><section class="panel auth-panel"><div class="auth-tabs"><button type="button" class="auth-tab active" data-panel="login">เข้าสู่ระบบ</button><button type="button" class="auth-tab" data-panel="signup">สร้างบัญชีพนักงาน</button></div>
<form id="login-form"><h2>เข้าสู่ระบบ</h2><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required maxlength="50"></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required minlength="10"></label><button class="button button-accent">เข้าสู่ระบบ</button><p class="form-status" role="status" aria-live="polite"></p></form>
<form id="signup-form" hidden><h2>สร้างบัญชีพนักงาน</h2><p class="auth-note">ต้องใช้รหัสเปิดรับสมัครจากผู้ดูแลระบบ</p><label>รหัสเปิดรับสมัคร<input name="signup_key" type="password" autocomplete="off" required></label><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]+"></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="new-password" required minlength="10"></label><button class="button button-accent">สร้างบัญชี</button><p class="form-status" role="status" aria-live="polite"></p></form></section></main>
<script src="/staff-login.js" defer></script></body></html>
