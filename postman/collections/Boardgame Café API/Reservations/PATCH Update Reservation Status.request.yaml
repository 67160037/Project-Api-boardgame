$kind: http-request
url: "{{baseUrl}}/api/v1/reservations/{{reservationId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "confirmed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response has message", function () { pm.expect(pm.response.json()).to.have.property("message"); });
    language: text/javascript
examples: ./.resources/PATCH Update Reservation Status.resources/examples
order: 3000
