$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/boardgames/4/reviews"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "reviewer_name": "ทดสอบ",
        "rating": 9
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "rating ต้องอยู่ระหว่าง 1-5"
        }
      }
order: 1000
