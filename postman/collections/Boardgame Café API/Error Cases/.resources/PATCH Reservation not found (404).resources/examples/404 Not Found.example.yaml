$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/reservations/999999/status"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "confirmed"
      }
response:
  statusCode: 404
  statusText: Not Found
