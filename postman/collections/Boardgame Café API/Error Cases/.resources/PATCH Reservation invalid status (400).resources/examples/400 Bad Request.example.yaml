$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/reservations/4/status"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "bad"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "status ต้องเป็นหนึ่งใน: pending, confirmed, cancelled"
        }
      }
order: 1000
