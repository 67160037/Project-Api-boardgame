$kind: http-request
url: "{{baseUrl}}/api/v1/boardgames/{{boardgameId}}/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reviewer_name": "ทดสอบ",
      "rating": 9
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () { pm.response.to.have.status(400); });
      pm.test("error.code is VALIDATION_ERROR", function () { pm.expect(pm.response.json().error.code).to.eql("VALIDATION_ERROR"); });
    language: text/javascript
examples: ./.resources/POST Review rating out of range (400).resources/examples
order: 3000
