$kind: http-request
url: "{{baseUrl}}/api/v1/reservations/999999/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "confirmed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () { pm.response.to.have.status(404); });
      pm.test("error.code is NOT_FOUND", function () { pm.expect(pm.response.json().error.code).to.eql("NOT_FOUND"); });
    language: text/javascript
examples: ./.resources/PATCH Reservation not found (404).resources/examples
order: 5000
