      if (!pm.environment.get("baseUrl") && !pm.collectionVariables.get("baseUrl")) {
        console.error("baseUrl ยังไม่ได้ตั้งค่า: เลือก Environment boardgame-api-dev ก่อนรัน");
      }
    language: text/javascript
