$kind: http-request
url: "{{baseUrl}}/api/v1/boardgames/{{boardgameId}}/reviews"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response has data", function () { pm.expect(pm.response.json()).to.have.property("data"); });
    language: text/javascript
examples: ./.resources/GET Boardgame Reviews.resources/examples
order: 6000
