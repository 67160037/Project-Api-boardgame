$kind: http-request
url: "{{baseUrl}}/api/v1/boardgames/{{boardgameId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response has data", function () { pm.expect(pm.response.json()).to.have.property("data"); });
      pm.test("has reviews array", function () { pm.expect(pm.response.json().data.reviews).to.be.an("array"); });
    language: text/javascript
examples: ./.resources/GET Boardgame Detail.resources/examples
order: 3000
