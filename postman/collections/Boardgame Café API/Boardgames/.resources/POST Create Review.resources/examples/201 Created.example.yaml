$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/boardgames/4/reviews"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "reviewer_name": "สมหญิง",
        "rating": 4,
        "comment": "สนุกมาก"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "เพิ่มรีวิวสำเร็จ",
        "data": {
          "id": 4,
          "boardgame_id": 4,
          "reviewer_name": "สมหญิง",
          "rating": 4,
          "comment": "สนุกมาก"
        }
      }
order: 1000
