$kind: http-request
url: "{{baseUrl}}/api/v1/boardgames?minPlayers=4&maxPlayers=6"
method: GET
queryParams:
  minPlayers: "4"
  maxPlayers: "6"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response has data", function () { pm.expect(pm.response.json()).to.have.property("data"); });
      pm.test("data is array", function () { pm.expect(pm.response.json().data).to.be.an("array"); });
    language: text/javascript
examples: ./.resources/GET Boardgames (filter by players).resources/examples
order: 1000
